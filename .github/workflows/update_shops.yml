name: 빈 상가 데이터 자동 갱신 (소상공인 상가정보)

on:
  schedule:
    # 매주 월요일 09:10 KST (상가정보는 분기 갱신이라 매일 돌릴 필요 없음)
    - cron: '10 0 * * 1'
  workflow_dispatch:  # 수동 실행 버튼

# 스냅샷 차분(공실 추정)을 위해 이전 커밋의 shops_snapshot.json/vacant.json이 필요.
jobs:
  update-shops:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 상가 데이터 수집 + 공실 차분 + 건축물대장 결합
        env:
          SEMAS_API_KEY: ${{ secrets.SEMAS_API_KEY }}
          # 건축물대장 키를 따로 쓰려면 등록(미설정 시 SEMAS_API_KEY 재사용 — 일반 인증키는 공용)
          MOLIT_BLD_API_KEY: ${{ secrets.MOLIT_BLD_API_KEY }}
        run: python scripts/fetch_shops.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shops.json data/shops_snapshot.json data/vacant.json data/bldg_cache.json data/vacant_history.json
          git diff --staged --quiet || git commit -m "빈 상가 데이터 갱신: $(date +'%Y-%m-%d %H:%M KST')"
          git push
